name: Validate metadata unknown fields

on:
  push:
    branches: [pypa/codex-validate-unknown-fields]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
      - name: Install validation dependencies
        run: uv pip install --system --only-binary hypothesis -e . --group test nox
      - name: Verify regressions on unchanged upstream source
        shell: bash
        run: |
          git fetch origin ef837aad3127167671eb37b9f6bd8a94ec7ce26e
          cp src/packaging/metadata.py /tmp/patched-metadata.py
          trap 'cp /tmp/patched-metadata.py src/packaging/metadata.py' EXIT
          git show ef837aad3127167671eb37b9f6bd8a94ec7ce26e:src/packaging/metadata.py > src/packaging/metadata.py
          set +e
          python -m pytest tests/test_metadata.py -q -k test_raw_validate_collects_unrecognized_fields --junitxml=red.xml > red.txt 2>&1
          result=$?
          set -e
          cat red.txt
          test "$result" -eq 1
          python - <<'PY'
          import xml.etree.ElementTree as ET
          suite = ET.parse('red.xml').getroot().find('testsuite')
          assert suite is not None
          assert (suite.attrib['tests'], suite.attrib['failures'], suite.attrib['errors']) == ('9', '8', '0'), suite.attrib
          PY
      - name: Run complete configured test session
        env:
          PYTHON_VERSION: ${{ matrix.python }}
        run: |
          git diff --exit-code -- src/packaging/metadata.py
          nox -s "tests-$PYTHON_VERSION" -- --junitxml=green.xml --color=no 2>&1 | tee green.txt
          COVERAGE_FILE=".coverage.$PYTHON_VERSION" python -m coverage report --include=src/packaging/metadata.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: metadata-python-${{ matrix.python }}
          path: |
            red.txt
            red.xml
            green.txt
            green.xml
          if-no-files-found: error

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.10'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
      - name: Run prescribed lint and distribution checks
        run: |
          uvx nox -s lint -- --show-diff-on-failure 2>&1 | tee lint.txt
          git diff --exit-code
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: metadata-lint
          path: lint.txt
          if-no-files-found: error
